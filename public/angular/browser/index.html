    <style>
      /* Critical loading screen - renders instantly */
      .app-loader {
        position: fixed;
        inset: 0;
        background: #0a0a0f;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .app-loader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .loader-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
      .loader-logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #0d9488, #0f766e);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: loaderPulse 2s ease-in-out infinite;
      }
      .loader-diamond {
        width: 24px;
        height: 24px;
        color: white;
        font-size: 1.25rem;
        line-height: 1;
      }
      .loader-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #f1f5f9;
        letter-spacing: -0.03em;
      }
      .loader-bar {
        width: 120px;
        height: 3px;
        background: #16161f;
        border-radius: 2px;
        overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #0d9488, #14b8a6);
        border-radius: 2px;
        animation: loaderSlide 1.2s ease-in-out infinite;
      }
      @keyframes loaderPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes loaderSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
